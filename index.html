<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ing. Břetislav Jirman – Odhady nemovitostí | jirman.cz</title>
  <meta name="description" content="Přesné a nestranné ocenění nemovitostí: znalecké posudky a odhady pro banky, soudy i dědictví. Domy, byty, pozemky i komerční objekty po celé ČR. Náchod." />
  <link rel="canonical" href="https://www.jirman.cz/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.jirman.cz/" />
  <meta property="og:title" content="Ing. Břetislav Jirman – Odhady nemovitostí | jirman.cz" />
  <meta property="og:description" content="Přesné a nestranné ocenění nemovitostí: znalecké posudky a odhady pro banky, soudy i dědictví. Domy, byty, pozemky i komerční objekty po celé ČR. Náchod." />
  <!-- og:image: doplňte konkrétní 1200×630 obrázek -->
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: #2c3e50;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    .site-header {
      background: #fff;
      border-bottom: 1px solid #dde3ec;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .site-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .logo-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a5fa8;
    }
    .logo-tagline {
      font-size: 0.78rem;
      color: #6b7a8d;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* --- Main --- */
    main {
      flex: 1;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .card-link {
      display: block;
      background: #fff;
      border: 1px solid #dde3ec;
      border-radius: 8px;
      padding: 48px 40px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      max-width: 460px;
      width: 100%;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .card-link:hover {
      box-shadow: 0 4px 24px rgba(26,95,168,0.12);
      border-color: #b8cee8;
      text-decoration: none;
    }

    .card-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a2e45;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 0.95rem;
      color: #5a6a7a;
      margin-bottom: 28px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .tag {
      background: #e8f0fb;
      color: #1a5fa8;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .btn-primary {
      display: inline-block;
      background: #1a5fa8;
      color: #fff;
      padding: 14px 32px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
      text-decoration: none;
    }
    .card-link:hover .btn-primary {
      background: #154d8a;
    }

    /* --- Footer --- */
    .site-footer {
      background: #1a2e45;
      color: #8a99ad;
      text-align: center;
      padding: 28px 0;
      font-size: 0.88rem;
    }

    @media (max-width: 480px) {
      .site-header .container { height: 60px; }
      .logo-name { font-size: 1rem; }
      .card-link { padding: 36px 24px; }
      main { padding: 48px 16px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="logo">
        <span class="logo-name">jirman.cz</span>
        <span class="logo-tagline">Náchod</span>
      </div>
    </div>
  </header>

  <main>
    <a class="card-link" href="/znalec/">
      <span class="card-icon">🏠</span>
      <h1 class="card-title">Ing. Břetislav Jirman</h1>
      <p class="card-sub">Odhady nemovitostí · Náchod</p>
      <div class="card-tags">
        <span class="tag">Certifikovaný znalec</span>
        <span class="tag">V oboru od roku 1992</span>
        <span class="tag">Soudně uznávané odhady</span>
      </div>
      <span class="btn-primary">Přejít na stránku →</span>
    </a>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Ing. Břetislav Jirman – Odhady nemovitostí. Všechna práva vyhrazena.</p>
  </footer>

</body>
</html>
