<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jirman.cz</title>
  <meta name="description" content="Ing. Břetislav Jirman – Odhady nemovitostí, Náchod. Certifikovaný soudní znalec v oboru od roku 1992." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f8f6;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .site-name {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 3rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0d8;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 1.25rem;
      display: block;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.75rem;
    }

    .tag {
      background: #f0f0eb;
      border-radius: 20px;
      padding: 0.3rem 0.85rem;
      font-size: 0.8rem;
      color: #444;
    }

    .card-cta {
      display: inline-block;
      background: #1a1a1a;
      color: #fff;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: background 0.15s ease;
    }

    .card:hover .card-cta {
      background: #333;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="container">

    <p class="site-name">jirman.cz</p>

    <a class="card" href="/znalec">
      <span class="card-icon">🏠</span>
      <h1 class="card-title">Ing. Břetislav Jirman</h1>
      <p class="card-subtitle">Odhady nemovitostí · Náchod</p>
      <div class="card-tags">
        <span class="tag">Certifikovaný znalec</span>
        <span class="tag">V oboru od roku 1992</span>
        <span class="tag">Soudně uznávané odhady</span>
      </div>
      <span class="card-cta">Přejít na stránku →</span>
    </a>

    <footer>&copy; 2026 jirman.cz</footer>

  </div>
</body>
</html>
